[project]
name = "paper-extractor"
version = "0.1.0"
description = "批量解析学术论文并抽取 11 个结构化字段"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "pydantic>=2.10,<3",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "streamlit>=1.61",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
